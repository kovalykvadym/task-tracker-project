# ==============================================================================
# MEMORY & CACHE SETTINGS (Optimized for 4GB RAM)
# ==============================================================================
# The main database cache. Rule of thumb: ~25% of available RAM.
shared_buffers = 1GB 

# Hint to the query planner about total available memory (~75% of RAM).
effective_cache_size = 3GB 

# Memory for complex sorting (ORDER BY, DISTINCT, JOIN) per connection.
# Increased to 32MB to reduce disk I/O during heavy queries.
work_mem = 32MB 

# Memory for maintenance tasks like VACUUM and CREATE INDEX.
# Increased to 512MB to significantly speed up migrations and indexing.
maintenance_work_mem = 512MB 


# ==============================================================================
# DISK & FILE SETTINGS
# ==============================================================================
# Cost of random disk access. Set to 1.1 for SSDs (Default 4.0 is for old HDDs).
random_page_cost = 1.1 

# Maximum size of temporary files to prevent queries from filling up the disk.
temp_file_limit = 10GB 


# ==============================================================================
# TIMEOUTS & LOCKS (Protection against hangs)
# ==============================================================================
# Maximum number of concurrent connections.
max_connections = 50

# Maximum time to wait for a lock before failing the query.
lock_timeout = 3s 

# Maximum execution time for a single statement to prevent infinite queries.
statement_timeout = 60s 

# Terminate transactions that are idle for too long (protects against app bugs).
idle_in_transaction_session_timeout = 30s 


# ==============================================================================
# MONITORING & LOGGING
# ==============================================================================
# Log all queries that take longer than 200ms to help identify bottlenecks.
log_min_duration_statement = 200ms 

# Required extension for postgres_exporter to collect performance metrics.
shared_preload_libraries = 'pg_stat_statements' 
pg_stat_statements.max = 10000
pg_stat_statements.track = all